name: Refresh events
on:
  workflow_dispatch:
  schedule:
    # 06:00, 14:00, 22:00 IST — every 8 hours
    - cron: '30 0,8,16 * * *'
permissions:
  contents: write
concurrency:
  group: refresh-events
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Fetch and normalize events
        run: npm run ingest
      - name: Validate event data
        run: npm run validate:data
      - name: Build site
        run: npm run build
      - name: Commit changed event data
        run: |
          if git diff --quiet -- data/; then
            echo "No event changes"
            exit 0
          fi
          git config user.name "doon.today bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh events"
          git push
